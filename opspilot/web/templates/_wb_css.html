{#- Workbench redesign (prototype v2) styles for the incident list and
    incident pages. System fonts only, no external assets; light and dark
    follow prefers-color-scheme. Pages using it set body class "wb". -#}
<style>
  body.wb {
    --bg: #f7f7f5; --surface: #ffffff; --sunk: #f1f1ee; --line: #dcdcd6; --line-soft: #e9e9e4;
    --ink: #16181b; --muted: #5d636c; --accent: #0b5fbf; --accent-soft: #e9f1fb;
    --ok: #1a7034; --ok-soft: #e8f4ec; --err: #b42318; --err-soft: #fcebea; --warn: #7d5200; --warn-soft: #fdf5dc;
    --human: #5338c4; --human-soft: #f1edfc;
    /* base.html names, so its header and parts follow this palette */
    --ink2: var(--muted); --ink3: var(--muted); --ink4: #9a9ea6; --line2: var(--line); --tint: var(--sunk); --acc: var(--accent);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
    background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans);
  }
  @media (prefers-color-scheme: dark) {
    body.wb {
      color-scheme: dark;
      --bg: #111315; --surface: #181b1e; --sunk: #1e2226; --line: #363b41; --line-soft: #2a2e33;
      --ink: #e6e8eb; --muted: #a2a8b0; --accent: #6cb2ff; --accent-soft: #15283b;
      --ok: #62c985; --ok-soft: #14261a; --err: #ff8a7f; --err-soft: #34191a; --warn: #ebc35c; --warn-soft: #2b2512;
      --human: #b3a3ff; --human-soft: #231d3f; --ink4: #6d727a;
    }
  }
  body.wb header.top { background: var(--surface); border-bottom-color: var(--line); }
  body.wb .brand i { background: var(--ink); }
  body.wb a { color: var(--accent); }
  body.wb :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body.wb button, body.wb .btn { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 13px; cursor: pointer; line-height: 1.4; }
  body.wb .btn:hover, body.wb button:hover { border-color: var(--ink); text-decoration: none; }
  body.wb .btn.primary, body.wb button.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  body.wb button[disabled], body.wb .btn[disabled] { opacity: .55; cursor: not-allowed; border-color: var(--line); }
  body.wb input, body.wb textarea, body.wb select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
  body.wb code, body.wb pre, body.wb .mono { font-family: var(--mono); font-size: 12.5px; }
  body.wb .muted { color: var(--muted); }
  body.wb .small { font-size: 12.5px; color: var(--muted); }
  body.wb h1, body.wb h2, body.wb h3 { border: 0; padding: 0; letter-spacing: 0; }
  body.wb table { width: auto; }
  body.wb th, body.wb td { border-bottom: 1px solid var(--line-soft); }

  body.wb header.top nav a { color: var(--muted); }
  body.wb header.top nav a[aria-current] { color: var(--ink); border-bottom-color: var(--ink); }
  .chatbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; font-weight: 600; }

  /* status: icon + words, never colour alone */
  .stat { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
  .stat .ic { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 11px; line-height: 1; }
  .t-run { color: var(--accent); } .t-run .ic { background: var(--accent-soft); }
  .t-ok { color: var(--ok); } .t-ok .ic { background: var(--ok-soft); }
  .t-err { color: var(--err); } .t-err .ic { background: var(--err-soft); font-weight: 800; }
  .t-warn { color: var(--warn); } .t-warn .ic { background: var(--warn-soft); }
  .t-human { color: var(--human); } .t-human .ic { background: var(--human-soft); }
  .t-muted { color: var(--muted); } .t-muted .ic { background: var(--sunk); }
  .pulse { animation: wbpulse 1.4s ease-in-out infinite; }
  @keyframes wbpulse { 50% { opacity: .3; } }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  body.wb button.chip { padding: 0 7px; border-radius: 6px; font-size: 12px; line-height: 1.6; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 0 7px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); line-height: 1.6; }
</style>

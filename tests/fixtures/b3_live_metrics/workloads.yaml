# Synthetic load for the CI job k8s-live-metrics (B3, #562, R8-25).
# busybox:1.37.0 multi-platform index, read from Docker Hub on 2026-11-19.
# ns-a: a CPU burner capped at 200m, a Pod holding about 64 MiB in a memory
# emptyDir (charged to its memory cgroup), and a two-container Pod; ns-b: one
# idle Pod. A ServiceAccount with no role at all gives the 403 token.
apiVersion: v1
kind: Namespace
metadata:
  name: ns-a
---
apiVersion: v1
kind: Namespace
metadata:
  name: ns-b
---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-burner
  namespace: ns-a
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: burn
      image: busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sh", "-c", "while :; do :; done"]
      resources:
        requests: {cpu: 200m, memory: 16Mi}
        limits: {cpu: 200m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: mem-holder
  namespace: ns-a
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: hold
      image: busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sh", "-c", "head -c 67108864 /dev/zero > /cache/fill && sleep 86400"]
      resources:
        requests: {cpu: 10m, memory: 96Mi}
        limits: {cpu: 100m, memory: 160Mi}
      volumeMounts:
        - {name: cache, mountPath: /cache}
  volumes:
    - name: cache
      emptyDir: {medium: Memory, sizeLimit: 128Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: two-containers
  namespace: ns-a
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: app
      image: busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sh", "-c", "while :; do :; done"]
      resources:
        limits: {cpu: 50m, memory: 32Mi}
    - name: sidecar
      image: busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sleep", "86400"]
      resources:
        limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: idle
  namespace: ns-b
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: idle
      image: busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sleep", "86400"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-metrics
  namespace: ns-b

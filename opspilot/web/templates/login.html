{% extends "base.html" %}
{% set nav = "login" %}
{% block title %}OpsPilot · sign in{% endblock %}
{% block body %}
<div class="card">
  <h1>Sign in</h1>
  {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
  {% if not sessions_enabled %}<p class="err">Sign-in is not configured on this workbench.</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">User name</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn primary">Sign in</button>
  </form>
</div>
{% endblock %}

{#- Incident page styles (web UX spec 2026-11-16, layout B). Included inside
    the body block so the shell stays unchanged; text inside <style> is not
    page text. Black, white and grey only: the shell's accent is overridden
    for this page. -#}
<style>
  .inc { --acc: var(--ink); --acc-soft: #ecebe7; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 40px; align-items: start; }
  .inc a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; }
  .inc a:hover { text-decoration-color: var(--ink); }
  .main { min-width: 0; }
  .crumb { font-size: 13px; color: var(--ink3); }
  .crumb a { color: var(--ink2); }
  .ihead { display: flex; gap: 12px 24px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; margin-top: 8px; }
  .ititle { min-width: 0; flex: 1 1 420px; }
  .wrap .ihead h1 { font-size: 21px; line-height: 1.3; margin: 0; max-width: 68ch; }
  .imeta { font-size: 12.5px; color: var(--ink3); margin: 4px 0 0; }
  .imeta code { font-size: 12px; color: var(--ink2); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .acts form.act { margin: 0; }
  .btn.danger { background: var(--ink); border-color: var(--ink); color: #fff; }
  .moremenu { position: relative; }
  .moremenu > summary { list-style: none; display: inline-block; }
  .moremenu > summary::-webkit-details-marker { display: none; }
  .moremenu > summary::after { content: " \25BE"; color: var(--ink3); }
  .moremenu .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 15; width: min(340px, calc(100vw - 32px)); background: #fff; border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 8px 28px rgba(0, 0, 0, .08); padding: 4px 14px; }
  .menu form.act { padding: 10px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 12.5px; color: var(--ink2); }
  .menu form.act:first-child { border-top: 0; }
  .menu label { display: grid; gap: 4px; }
  .menu input, .menu select { width: 100%; }
  .menu button { justify-self: start; }
  .confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; border: 1px solid var(--line2); border-radius: 8px; padding: 6px 6px 6px 12px; background: #fff; max-width: 100%; }
  .stline { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 14px 0 0; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .stline .sw { font-weight: 500; }
  .stline > span + span { color: var(--ink2); }
  .stored-d { margin-top: 6px; font-size: 12.5px; color: var(--ink2); }
  .stored-d > summary { color: var(--ink3); padding: 4px 0; list-style: none; display: inline-block; }
  .stored-d > summary::-webkit-details-marker { display: none; }
  .stored-d > summary::before { content: "\25B8  "; font-size: 10px; }
  .stored-d[open] > summary::before { content: "\25BE  "; }
  .stored, .rel p { font-size: 12.5px; color: var(--ink2); margin: 2px 0 0; }
  .stored code, .rel code { font-size: 12px; }
  .stored .badge, .prov .badge { background: none; border: 0; padding: 0; font-size: inherit; color: var(--ink); font-weight: 500; }
  .stored strong { font-weight: 500; color: var(--ink); }

  .blk { margin-top: 30px; min-width: 0; }
  .wrap .blk h2 { font-size: 16px; margin: 0 0 10px; padding: 0; border: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .sub { font-weight: 400; font-size: 12.5px; color: var(--ink3); }
  .livesub { font-size: 13px; color: var(--ink2); margin: -4px 0 8px; }
  .concl { font-size: 17px; line-height: 1.45; font-weight: 500; max-width: 72ch; margin: 0; }
  .concl.quiet { font-weight: 400; color: var(--ink2); font-size: 15px; }
  .concl.sub2 { font-size: 15px; color: var(--ink2); font-weight: 400; margin-top: 4px; }
  .cmeta { font-size: 12.5px; color: var(--ink3); margin: 6px 0 0; }
  .prov { margin: 4px 0 0; }
  .prov code { font-size: 11px; color: var(--ink3); }
  .flag { font-size: 14px; font-weight: 500; margin: 10px 0 0; }
  details.more > summary { font-size: 12.5px; color: var(--ink2); margin-top: 8px; list-style: none; display: inline-block; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "+ "; }
  details.more[open] > summary::before { content: "\2212 "; }
  details.more p { color: var(--ink2); line-height: 1.6; max-width: 80ch; }
  .wrap h3.sh { font-size: 14px; margin: 24px 0 8px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  h3.sh .n { font-weight: 400; color: var(--ink3); font-size: 12.5px; }
  .none { font-size: 13px; color: var(--ink2); margin: 0; }
  .small { font-size: 12.5px; color: var(--ink2); margin: 8px 0 0; }
  .lnk { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; cursor: pointer; font-size: 13px; font-weight: 400; }
  .showmore { margin-top: 8px; }

  #evidence-charts { margin: 4px 0 12px; }
  .evidence-chart { margin: 8px 0 0; overflow-x: auto; }
  .evidence-chart svg { display: block; min-width: 520px; height: auto; }
  .evidence-chart svg text { fill: var(--ink3); font-family: var(--sans); }
  .evidence-chart figcaption { font-size: 12.5px; color: var(--ink2); margin-top: 6px; max-width: 90ch; }
  .chart-legend { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; }

  .kev { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .kev > li { border-bottom: 1px solid var(--line); }
  .js .kev:not(.all) > li.rest { display: none; }
  .ev > summary { list-style: none; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 8px; padding: 9px 18px 9px 0; cursor: pointer; scroll-margin-top: 24px; position: relative; }
  .ev > summary::-webkit-details-marker { display: none; }
  .ev > summary::after { content: "\203A"; position: absolute; right: 2px; top: 9px; color: var(--ink3); transition: transform .15s; }
  .ev[open] > summary::after { transform: rotate(90deg); }
  .ev .n { color: var(--ink3); font-variant-numeric: tabular-nums; font-size: 12.5px; padding-top: 1px; }
  .ev .tx { font-size: 13.5px; }
  .ev .src { grid-column: 2; font-family: var(--mono); font-size: 11.5px; color: var(--ink3); }
  .tag { font-size: 11px; color: var(--ink2); border: 1px solid var(--line2); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
  .evx { margin: 0 0 12px 34px; font-size: 12.5px; }
  .evi + .evi { margin-top: 10px; }
  .evr pre { max-height: 360px; overflow: auto; font-size: 11.5px; color: var(--ink2); white-space: pre-wrap; word-break: break-word; }
  .evr dl.kv { grid-template-columns: 70px minmax(0, 1fr); font-size: 12.5px; }
  .plain { list-style: none; margin: 0; padding: 0; }
  .plain > li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; scroll-margin-top: 24px; }
  .plain > li:first-child { border-top: 1px solid var(--line); }
  .plain .why { display: block; font-size: 12px; color: var(--ink3); margin-top: 2px; }
  .plain .rtx { color: var(--ink2); }
  .ntx { white-space: pre-wrap; margin-top: 2px; }
  .rc { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
  :target { animation: fl 1.6s ease; }
  @keyframes fl { 0%, 40% { background: var(--acc-soft); } 100% { background: transparent; } }
  #coverage-gaps { margin-top: 0; }

  .how > summary { list-style: none; display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .how > summary::-webkit-details-marker { display: none; }
  .how > summary::before { content: "\203A"; color: var(--ink3); display: inline-block; width: 10px; transition: transform .15s; }
  .how[open] > summary::before { transform: rotate(90deg); }
  .how > summary .hs { font-size: 13.5px; font-weight: 500; }
  .how > summary .meta { font-size: 12.5px; color: var(--ink3); }
  .filt { display: flex; gap: 16px; margin: 12px 0 4px; font-size: 13px; flex-wrap: wrap; }
  .filt button { background: none; border: 0; border-radius: 0; padding: 2px 0; color: var(--ink3); border-bottom: 1.5px solid transparent; }
  .filt button[aria-pressed=true] { color: var(--ink); border-bottom-color: var(--ink); }
  .rnds, .calls { list-style: none; margin: 0; padding: 0; }
  .rnd { display: flex; gap: 14px; padding: 8px 0; border-top: 1px solid var(--line); scroll-margin-top: 24px; }
  .rnd:first-child { border-top: 0; }
  .js .how:not(.all) .rnd.rest { display: none; }
  .rmore { padding: 8px 0; border-top: 1px solid var(--line); }
  html:not(.js) .rmore { display: none; }
  .rnd .rn { font-family: var(--mono); font-size: 12px; color: var(--ink2); width: 70px; flex: none; padding-top: 1px; }
  .rnd .rn time, .rnd .rn span { display: block; font-size: 11px; }
  .calls { flex: 1 1 auto; min-width: 0; display: grid; gap: 5px; }
  .call { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 13px; scroll-margin-top: 24px; }
  .call .q { color: var(--ink); text-decoration: none; }
  .call .q code { font-size: 12.5px; }
  .st { font-size: 12px; color: var(--ink2); }
  .st.err { color: var(--ink); font-weight: 500; }
  .st .badge { background: none; border: 0; padding: 0; font-size: inherit; color: inherit; font-weight: inherit; }
  .call .tags { flex: 1 1 240px; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .call .tags a { font-size: 12.5px; color: var(--ink2); text-decoration: none; }
  .call .tags a b { font-family: var(--mono); font-weight: 500; font-size: 11.5px; color: var(--ink); margin-right: 4px; }
  .call .extra { flex-basis: 100%; font-size: 12.5px; color: var(--ink2); }
  .nouse { font-size: 12px; color: var(--ink3); }
  .call.is-unused .q { color: var(--ink2); }
  .how[data-f=problem] .call:not(.is-problem), .how[data-f=unused] .call:not(.is-unused) { display: none; }
  .how[data-f=problem] .rnd:not(:has(.is-problem)), .how[data-f=unused] .rnd:not(:has(.is-unused)) { display: none; }
  .how[data-f=problem] .rmore, .how[data-f=unused] .rmore { display: none; }
  .wait { padding: 8px 0 4px 84px; font-size: 12.5px; color: var(--ink3); border-top: 1px solid var(--line); }

  .hrun { border-bottom: 1px solid var(--line); }
  .hrun:first-of-type { border-top: 1px solid var(--line); }
  .hrun > summary { list-style: none; padding: 8px 0; font-size: 13.5px; }
  .hrun > summary::-webkit-details-marker { display: none; }
  .hrun > summary::before { content: "\203A"; color: var(--ink3); display: inline-block; width: 14px; transition: transform .15s; }
  .hrun[open] > summary::before { transform: rotate(90deg); }
  .hrun > summary code { font-size: 12px; color: var(--ink2); }
  .hbody { padding: 0 0 10px 14px; font-size: 13px; color: var(--ink2); }
  .hbody ul { padding-left: 18px; margin: 4px 0; }

  .big { font-size: 15px; font-weight: 500; margin: 0; line-height: 1.4; }
  .big small { font-size: 12.5px; font-weight: 400; color: var(--ink2); margin-left: 6px; }
  .strip { display: flex; height: 12px; border-radius: 2px; overflow: hidden; margin-top: 10px; max-width: 560px; }
  .strip.part { background: var(--tint); }
  .strip i { display: block; height: 100%; }
  .s-deg { background: var(--ink2); } .s-nd { background: var(--hatch); background-color: #fff; } .s-ok { background: var(--ink4); }
  .axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--ink3); margin-top: 3px; max-width: 560px; }
  .skey { display: flex; gap: 12px; font-size: 12px; color: var(--ink3); margin-top: 6px; flex-wrap: wrap; }
  .skey span::before { content: ""; display: inline-block; width: 10px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .skey .a::before { background: var(--ink2); } .skey .b::before { background: var(--ink4); } .skey .c::before { background: var(--hatch); box-shadow: inset 0 0 0 1px var(--ink4); }
  dl.rk { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 4px 10px; margin: 10px 0 0; font-size: 12.5px; }
  dl.rk dt { color: var(--ink2); }
  dl.rk dd { margin: 0; overflow-wrap: anywhere; }
  .sub-d { margin-top: 10px; }
  .sub-d > summary { font-size: 12.5px; color: var(--ink2); list-style: none; }
  .sub-d > summary::-webkit-details-marker { display: none; }
  .sub-d > summary::before { content: "+ "; }
  .sub-d[open] > summary::before { content: "\2212 "; }
  .blk-in { margin-top: 12px; }
  .badge { font-size: 11px; }

  .raw { border-top: 1px solid var(--line); }
  .raw > summary { padding: 9px 0; font-size: 13.5px; list-style: none; display: flex; gap: 8px; align-items: center; }
  .raw > summary::-webkit-details-marker { display: none; }
  .raw > summary::before { content: "\25B8"; color: var(--ink3); font-size: 11px; }
  .raw[open] > summary::before { content: "\25BE"; }
  .raw .body { padding: 0 0 14px 18px; min-width: 0; }
  #control h3 { font-size: 13.5px; margin: 18px 0 0; }
  .log { font-family: var(--mono); font-size: 12px; list-style: none; padding: 0; margin: 8px 0 0; }
  .log li { padding: 2px 0; overflow-wrap: anywhere; }
  .log .tm { color: var(--ink2); margin-right: 10px; }
  .log .sq { color: var(--ink4); margin-right: 8px; display: inline-block; min-width: 2em; }
  .log .pl { color: var(--ink3); }
  .dlog { font-size: 12px; }
  .dlog td { padding: 4px 8px 4px 0; }
  .dlog .sys { color: var(--ink3); }
  .cov { font-size: 12px; }

  .side { min-width: 0; border-top: 1px solid var(--line); margin-top: 36px; padding-top: 4px; }
  .wrap .side h2 { font-size: 14px; margin: 12px 0 8px; padding: 0; border: 0; }
  .tl { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  .tl li { padding: 5px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .tl .t { font-family: var(--mono); font-size: 11.5px; color: var(--ink3); flex: none; }
  form.act.note { display: grid; gap: 6px; margin: 0; padding: 12px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink2); }
  form.act.note .fl { line-height: 1.45; }
  form.act.note input { width: 100%; }
  form.act.note button { justify-self: start; }

  @media (min-width: 1100px) {
    .inc { grid-template-columns: minmax(0, 1fr) 380px; }
    .side { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow-y: auto; border-top: 0; margin-top: 0; padding: 4px 0 16px 20px; border-left: 1px solid var(--line); }
  }
  @media (max-width: 720px) {
    .wrap .ihead h1 { font-size: 19px; }
    .concl { font-size: 16px; }
    .rnd { flex-direction: column; gap: 4px; }
    .rnd .rn { width: auto; display: flex; gap: 8px; }
    .rnd .rn time, .rnd .rn span { display: inline; }
    .wait { padding-left: 0; }
    .ev > summary { grid-template-columns: 22px minmax(0, 1fr); }
    .evx { margin-left: 0; }
    .moremenu[open] { flex-basis: 100%; }
    .moremenu .menu { position: static; width: auto; margin-top: 6px; box-shadow: none; }
  }
</style>

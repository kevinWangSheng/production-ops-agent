# CI k8s-backends (B4, #563): a second identity with only the base read-only
# ClusterRole (no Helm overlay), for SOURCE_FORBIDDEN (I-7).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot-investigator-base
  namespace: opspilot-readonly
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: b4-base-only
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opspilot-investigator-readonly
subjects:
  - kind: ServiceAccount
    name: opspilot-investigator-base
    namespace: opspilot-readonly

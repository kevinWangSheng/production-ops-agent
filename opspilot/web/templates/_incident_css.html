{#- Incident page styles (#572, baseline c4). Included inside the body block so
    the shell stays unchanged; text inside <style> is not page text. -#}
<style>
  .crumb { font-size: 13px; color: var(--ink2); }
  .crumb a { color: var(--ink2); }
  .wrap h1 { margin-top: 8px; }
  h1 .m { vertical-align: .22em; margin-right: 10px; }
  .alert-name { font-size: 14px; color: var(--ink2); margin-top: 4px; }
  .alert-name .who { font-size: 13px; }
  .ids, .rel p, .stored { font-size: 12.5px; color: var(--ink2); margin: 2px 0 0; }
  .ids code, .rel code, .stored code { font-size: 12px; }
  .when { font-size: 12.5px; color: var(--ink2); margin-top: 2px; font-family: var(--mono); }
  .stored .badge, .prov .badge { background: none; border: 0; padding: 0; font-size: inherit; color: var(--ink); font-weight: 500; }
  .stored strong { font-weight: 500; color: var(--ink); }

  .band { display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); gap: 0 32px; margin-top: 24px; padding-block: 18px 20px; border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line); }
  .band > a { color: inherit; display: block; }
  .band > a:hover { text-decoration: none; }
  .band > a:hover .a { text-decoration: underline; text-decoration-color: var(--ink4); }
  .band .q { font-size: 13px; color: var(--ink3); }
  .band .a { font-size: 15.5px; font-weight: 500; line-height: 1.35; margin-top: 4px; }
  .band .sb { font-size: 13px; color: var(--ink2); margin-top: 4px; line-height: 1.45; }
  .band .who { margin-top: 10px; }

  .tl-sec .tl-h { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; margin-top: 22px; }
  .wrap .tl-sec h2 { font-size: 13px; font-weight: 500; color: var(--ink2); border: 0; padding: 0; margin: 0; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink3); }
  .legend span { display: inline-flex; align-items: center; }
  .legend .m, .tl .m { background: var(--ink3); }
  .legend .m-alert, .tl .m-alert { background: none; border-color: var(--ink3); }
  .tl { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); row-gap: 14px; }
  .tl li { position: relative; padding: 18px 16px 0 0; }
  .tl li::before { content: ""; position: absolute; top: 4px; left: 12px; right: 0; height: 1px; background: var(--line2); }
  .tl li:last-child::before { display: none; }
  .tl .m { position: absolute; top: 0; left: 0; margin: 0; }
  .tl .t { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
  .tl .e { font-size: 13px; color: var(--ink); margin-top: 1px; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 352px; gap: 0 64px; align-items: start; margin-top: 36px; }
  .grid > .s { grid-column: 1; }
  .rail { grid-column: 2; grid-row: 1 / span 9; min-width: 0; }
  .s { padding-top: 28px; margin-top: 32px; border-top: 1px solid var(--line); min-width: 0; }
  .s.first { padding-top: 0; margin-top: 0; border-top: 0; }
  .wrap .s h2, .wrap .rail h2, .wrap .drawer h2 { border: 0; padding: 0; margin: 0; }
  .s-h { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .s-h .sub { color: var(--ink2); font-size: 13px; }

  .prov { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink2); margin: 0 0 12px; }
  .prov code { font-size: 11.5px; color: var(--ink3); }
  .lede { font-size: 20px; line-height: 1.5; max-width: 70ch; margin: 0; }
  .lede.quiet { font-size: 17px; color: var(--ink); }
  .flag { font-size: 15px; font-weight: 500; margin: 0 0 10px; max-width: 80ch; }
  details.more > summary { color: var(--acc); font-size: 13px; margin-top: 12px; list-style: none; display: inline-block; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "+ "; }
  details.more[open] > summary::before { content: "\2212 "; }
  details.more p { color: var(--ink2); line-height: 1.65; max-width: 80ch; }
  .counts { margin-top: 16px; font-size: 13px; color: var(--ink2); line-height: 1.9; }
  .counts a { color: var(--ink2); white-space: nowrap; }
  .counts a b { font-weight: 600; color: var(--ink); }
  .counts .dot { color: var(--ink4); margin: 0 2px; }
  .disclaim { margin-top: 18px; font-size: 13px; color: var(--ink2); max-width: 90ch; }
  .small { font-size: 12.5px; color: var(--ink2); margin: 8px 0 0; }

  #evidence-charts { margin-top: 28px; }
  #evidence-charts h3 { font-size: 14px; font-weight: 500; margin: 0; }
  .evidence-chart { margin: 12px 0 0; overflow-x: auto; }
  .evidence-chart svg { display: block; min-width: 520px; height: auto; }
  .evidence-chart svg text { fill: var(--ink3); font-family: var(--sans); }
  .evidence-chart figcaption { font-size: 12.5px; color: var(--ink2); margin-top: 6px; max-width: 90ch; }
  .chart-legend { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; }

  .rc { font-family: var(--mono); font-size: 11.5px; color: var(--acc); white-space: nowrap; border-bottom: 1px dotted currentColor; line-height: 1.3; }
  .rc:hover { text-decoration: none; border-bottom-style: solid; }

  .grp { border-top: 1px solid var(--line); }
  .grp:first-of-type { border-top: 0; }
  .grp > summary { list-style: none; padding: 12px 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .grp > summary::-webkit-details-marker { display: none; }
  .grp > summary h3 { font-size: 14.5px; margin: 0; }
  .grp > summary .note { font-size: 12.5px; color: var(--ink2); }
  .grp > summary::after { content: "Show"; margin-left: auto; font-size: 12.5px; color: var(--acc); }
  .grp[open] > summary::after { content: "Hide"; }
  .grp ol, .grp ul { margin: 0 0 14px; padding: 0; list-style: none; }
  .grp ol > li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 6px; padding: 7px 0; scroll-margin-top: 24px; }
  .grp ul > li { padding: 5px 0; }
  .grp.rj ol > li { color: var(--ink2); }
  .grp .none { font-size: 13px; color: var(--ink2); margin: 0 0 12px; }
  .cid { font-family: var(--mono); font-size: 11.5px; color: var(--ink3); padding-top: 2px; }
  .cites { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font-size: 12.5px; color: var(--ink2); }
  .flash { animation: fl 1.6s ease; }
  @keyframes fl { 0%, 40% { background: var(--acc-soft); } 100% { background: transparent; } }

  .meter { display: flex; height: 8px; border-radius: 2px; overflow: hidden; width: 100%; max-width: 300px; background: var(--tint); margin-top: 5px; }
  .meter i { display: block; height: 100%; }
  .meter .m-ok { background: var(--acc); }
  .meter .m-nd { background: var(--ink4); }
  .meter .m-f { background: var(--err); }
  .meter .m-none { background: var(--hatch); width: 100%; }
  .vkey { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink3); margin-top: 10px; }
  .vkey i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .ni { color: var(--ink); font-weight: 500; }

  .how > summary { list-style: none; display: block; }
  .how > summary::-webkit-details-marker { display: none; }
  .how > summary h2 { display: inline; }
  .how > summary .tog { font-size: 12.5px; color: var(--acc); margin-left: 12px; }
  .how > summary .tog::after { content: "Show"; }
  .how[open] > summary .tog::after { content: "Hide"; }
  .how > summary .one { display: block; font-size: 13.5px; color: var(--ink2); margin-top: 6px; }
  .how > summary .meta { display: block; font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
  .filt { display: flex; gap: 16px; margin: 16px 0 4px; font-size: 13px; flex-wrap: wrap; }
  .filt button { background: none; border: 0; border-radius: 0; padding: 2px 0; color: var(--ink3); border-bottom: 1.5px solid transparent; }
  .filt button[aria-pressed=true] { color: var(--ink); border-bottom-color: var(--ink); }
  .rnds, .calls { list-style: none; margin: 0; padding: 0; }
  .rnd { display: flex; gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); scroll-margin-top: 24px; }
  .rnd:first-child { border-top: 0; }
  .rnd .rn { font-family: var(--mono); font-size: 12px; color: var(--ink2); width: 66px; flex: none; padding-top: 1px; }
  .rnd .rn time, .rnd .rn span { display: block; font-size: 11px; }
  .calls { flex: 1 1 auto; min-width: 0; display: grid; gap: 6px; }
  .call { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 13px; scroll-margin-top: 24px; }
  .call .q { color: var(--ink); }
  .call .q code { font-size: 12.5px; }
  .st { font-size: 12px; color: var(--ink2); }
  .st.err { color: var(--err); }
  .st .badge { background: none; border: 0; padding: 0; font-size: inherit; color: inherit; font-weight: 400; }
  .call .to { color: var(--ink4); }
  .call .tags { flex: 1 1 260px; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .call .tags a { font-size: 12.5px; color: var(--ink2); }
  .call .tags a b { font-family: var(--mono); font-weight: 500; font-size: 11.5px; color: var(--acc); margin-right: 4px; }
  .call .extra { flex-basis: 100%; font-size: 12.5px; color: var(--ink2); }
  .nouse { font-size: 12.5px; color: var(--ink2); font-style: italic; }
  .call.is-unused .q { color: var(--ink2); }
  .call.hl { background: var(--acc-soft); }
  .how[data-f=problem] .call:not(.is-problem), .how[data-f=unused] .call:not(.is-unused) { display: none; }
  .how[data-f=problem] .rnd:not(:has(.is-problem)), .how[data-f=unused] .rnd:not(:has(.is-unused)) { display: none; }

  .runrow { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: 13px; color: var(--ink2); padding: 8px 0; border-bottom: 1px solid var(--line); }
  .runrow code { font-size: 12px; color: var(--ink); }
  .investigation-history { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .investigation-history h3 { font-size: 13.5px; }
  #knowledge-hints ul { padding-left: 18px; font-size: 13px; }

  .raw { border-top: 1px solid var(--line); }
  .raw:first-of-type { border-top: 0; }
  .raw > summary { padding: 10px 0; font-weight: 500; list-style: none; display: flex; gap: 8px; align-items: center; }
  .raw > summary::-webkit-details-marker { display: none; }
  .raw > summary::before { content: "\25B8"; color: var(--ink3); font-size: 11px; }
  .raw[open] > summary::before { content: "\25BE"; }
  .raw .body { padding: 0 0 14px 18px; min-width: 0; }
  .raw h3 { font-size: 13.5px; }
  .log { font-family: var(--mono); font-size: 12px; list-style: none; padding: 0; margin: 8px 0 0; }
  .log li { padding: 2px 0; overflow-wrap: anywhere; }
  .log .tm { color: var(--ink2); margin-right: 10px; }
  .log .sq { color: var(--ink4); margin-right: 8px; display: inline-block; min-width: 2em; }
  .log .pl { color: var(--ink3); }

  .blk + .blk { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 22px; }
  .blk-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .wrap .blk-h h2 { font-size: 15px; }
  .big { font-size: 18px; font-weight: 500; margin-top: 8px; line-height: 1.3; }
  .big small { display: block; font-size: 13px; font-weight: 400; color: var(--ink2); margin-top: 2px; }
  .strip { display: flex; height: 14px; border-radius: 2px; overflow: hidden; margin-top: 14px; }
  .strip.part { background: var(--tint); }
  .strip i { display: block; height: 100%; }
  .s-deg { background: #d79a94; } .s-nd { background: var(--hatch); background-color: #fff; } .s-ok { background: var(--acc); }
  .axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--ink3); margin-top: 3px; }
  .skey { display: flex; gap: 12px; font-size: 12px; color: var(--ink3); margin-top: 6px; flex-wrap: wrap; }
  .skey span::before { content: ""; display: inline-block; width: 10px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .skey .a::before { background: #d79a94; } .skey .b::before { background: var(--acc); } .skey .c::before { background: var(--hatch); box-shadow: inset 0 0 0 1px var(--ink4); }
  dl.rk { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 4px 10px; margin: 12px 0 0; font-size: 12.5px; }
  dl.rk dt { color: var(--ink2); }
  dl.rk dd { margin: 0; overflow-wrap: anywhere; }
  .rail-link { display: inline-block; font-size: 12.5px; margin-top: 10px; }
  .perm { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; }
  .perm li { display: flex; gap: 8px; padding: 2px 0; color: var(--ink2); }
  .perm b { color: var(--ink); width: 12px; flex: none; }
  .ctl > summary, .sub-d > summary { font-size: 13px; color: var(--acc); margin-top: 12px; list-style: none; }
  .ctl > summary::-webkit-details-marker, .sub-d > summary::-webkit-details-marker { display: none; }
  .ctl[open] > summary .t-show, .ctl:not([open]) > summary .t-hide { display: none; }
  .sub-d > summary::before { content: "+ "; }
  .sub-d[open] > summary::before { content: "\2212 "; }
  form.act { display: block; margin: 0; padding: 9px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink2); }
  form.act:first-of-type { border-top: 0; }
  form.act .fl { display: block; font-size: 12.5px; color: var(--ink2); margin-bottom: 6px; }
  form.act input:not([type=hidden]), form.act select { display: block; width: 100%; margin: 0 0 6px; }
  form.act button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .gen { font-size: 12px; color: var(--ink2); margin-top: 8px; }
  .dlog { font-size: 12px; }
  .dlog td { padding: 4px 8px 4px 0; }
  .dlog .sys { color: var(--ink3); }

  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: #fff; border-left: 1px solid var(--line2); box-shadow: -16px 0 40px rgba(0, 0, 0, .06); padding: 20px 22px; transform: translateX(105%); transition: transform .18s ease; z-index: 20; overflow-y: auto; visibility: hidden; }
  .drawer.open { transform: none; visibility: visible; }
  .drawer-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .wrap .drawer-h h2 { font-size: 15px; }
  .drawer-h button { background: none; border: 0; color: var(--acc); font-size: 13px; padding: 0; }
  .dr-body { margin-top: 14px; font-size: 13px; }
  .dr-body dl.kv { grid-template-columns: 84px minmax(0, 1fr); }
  .dr-body h3 { font-size: 13px; font-weight: 500; color: var(--ink2); margin-top: 18px; }
  .dr-body ul { list-style: none; padding: 0; margin: 6px 0 0; }
  .dr-body li { padding: 5px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink2); }
  .dr-body li:first-child { border-top: 0; }
  .dr-full { display: inline-block; margin-top: 16px; font-weight: 500; }

  @media (max-width: 1180px) {
    .band { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 18px; }
    .band > a:first-child { grid-column: 1 / -1; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .grid > * { grid-column: 1; }
    .rail { grid-row: auto; order: 2; border-top: 1px solid var(--line); margin-top: 32px; padding-top: 28px; }
    .grid > .s.first { order: 1; }
    .grid > .s:not(.first) { order: 3; }
  }
  @media (max-width: 720px) {
    .band { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .band > a + a { border-top: 1px solid var(--line); padding-top: 12px; }
    .band .who { margin-top: 6px; }
    .tl { grid-template-columns: minmax(0, 1fr); row-gap: 0; }
    .tl li { padding: 0 0 12px 22px; }
    .tl li::before { top: 12px; bottom: -2px; left: 3.5px; right: auto; width: 1px; height: auto; }
    .tl .m { top: 5px; }
    .tl .t { display: inline; margin-right: 8px; }
    .tl .e { display: inline; }
    .lede { font-size: 18px; }
    .rnd { flex-direction: column; gap: 4px; }
    .call .to { display: none; }
    .call .tags { flex-basis: 100%; }
  }
</style>

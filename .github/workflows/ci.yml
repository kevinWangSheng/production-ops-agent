name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.8"
          python-version: "3.12.13"
          enable-cache: false
      - name: Install locked development dependencies
        run: make setup
      - name: Run development checks
        run: make check
      - name: Install checksum-pinned Gitleaks
        run: python3 scripts/install_gitleaks.py --directory tmp/ci-gitleaks
      - name: Secret scan and synthetic detection self-test
        run: python3 scripts/check_secrets.py --binary tmp/ci-gitleaks/gitleaks

  m0-postgres:
    name: m0-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Official postgres:17.9 multi-platform index, read from Docker registry.
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_USER: m0_lab
          POSTGRES_DB: m0_budget
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55431:5432
        options: >-
          --cpus=1 --memory=512m
          --health-cmd "pg_isready -U m0_lab -d m0_budget"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.8"
          python-version: "3.12.13"
          enable-cache: false
      - name: Install locked experiment dependencies
        run: make setup
      - name: Install PostgreSQL 17 client (pg_dump must match the 17.9 service)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Migration path 1, empty database to head
        env:
          OPSPILOT_DSN: host=127.0.0.1 port=55431 dbname=m0_budget user=m0_lab
          OPSPILOT_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: |
          HEAD=$(.venv/bin/python -c "from opspilot import schema; print(schema.head_revision())")
          make migrate | tee /tmp/migrate-empty.log
          grep -q "schema upgraded: ${HEAD}" /tmp/migrate-empty.log
          .venv/bin/python -m opspilot.schema check
      - name: Migration path 2, database built by the pre-Alembic DDL, takeover to head
        env:
          OPSPILOT_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: |
          PSQL=/usr/lib/postgresql/17/bin/psql
          $PSQL -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55431 -U m0_lab -d postgres -c "CREATE DATABASE legacy_takeover"
          $PSQL -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55431 -U m0_lab -d legacy_takeover -f tests/integration/legacy_schema_2026-10-05.sql
          export OPSPILOT_DSN="host=127.0.0.1 port=55431 dbname=legacy_takeover user=m0_lab"
          HEAD=$(.venv/bin/python -c "from opspilot import schema; print(schema.head_revision())")
          make migrate | tee /tmp/migrate-legacy.log
          grep -q "schema stamped: ${HEAD}" /tmp/migrate-legacy.log
          .venv/bin/python -m opspilot.schema check
          .venv/bin/python - <<'PY'
          from opspilot import schema
          lab = "host=127.0.0.1 port=55431 user=m0_lab"
          fresh = schema.schema_dump(f"{lab} dbname=m0_budget", pg_dump="/usr/lib/postgresql/17/bin/pg_dump")
          taken = schema.schema_dump(f"{lab} dbname=legacy_takeover", pg_dump="/usr/lib/postgresql/17/bin/pg_dump")
          assert fresh == taken, "schema dump of fresh head and takeover differ"
          print(f"fresh head and takeover dumps identical ({len(fresh.splitlines())} lines)")
          PY
      - name: Verify ledger and adapter integration on synthetic PostgreSQL
        env:
          M0_B_POSTGRES: "1"
          M1_DURABLE_POSTGRES: "1"
          OPSPILOT_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        # Native local cluster restart is independently tested on macOS, not this service.
        run: .venv/bin/python -m pytest tests/integration tests/acceptance/test_f6_recovery.py tests/contracts/test_f6_observation.py -q

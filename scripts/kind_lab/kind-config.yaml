# kind cluster for the M1-02 lab (scripts/kind_lab.py). One node; the three
# NodePorts the trimmed OTel Demo exposes are published on the host loopback
# at the same ports the M0 Compose lab used, so the product profile's default
# addresses (opspilot.tools.otel_demo.OtelDemoConfig) keep working:
#   18080  frontend-proxy (frontend, /jaeger/ui route)
#   19090  Prometheus
#   16686  Jaeger query (scripts/kind_lab/jaeger-nodeport.yaml)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: opspilot-m1
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30090
        hostPort: 19090
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30686
        hostPort: 16686
        listenAddress: 127.0.0.1
        protocol: TCP

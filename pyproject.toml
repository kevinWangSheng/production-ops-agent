[project]
name = "opspilot"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]
m0 = [
    "httpx2==2.12.0",
    "langsmith==0.12.2",
    "openai==3.10.0",
    "psycopg[binary]==3.3.3",
    "pydantic==2.13.5",
]

[tool.uv]
package = false
default-groups = ["dev", "m0"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:langsmith_plugin"

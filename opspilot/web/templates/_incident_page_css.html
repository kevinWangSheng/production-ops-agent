{#- Incident page layout (prototype v2): one result-first column and a
    persistent Chat panel on the right; the panel is a bottom drawer under
    960px. No coloured card borders, no capitals labels, no boxed log. -#}
<style>
  .shell { display: grid; grid-template-columns: minmax(0, 1fr) 400px; align-items: start; }
  .shell.chat-closed { grid-template-columns: minmax(0, 1fr); }
  .shell.chat-closed .panel { display: none; }
  .main { min-width: 0; padding: 22px 28px 64px; }
  .col { max-width: 960px; margin: 0 auto; display: grid; gap: 28px; min-width: 0; }
  .col > * { min-width: 0; }
  .crumb { font-size: 12.5px; color: var(--muted); }
  .crumb a { color: inherit; }
  .head { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: space-between; align-items: flex-start; margin-top: 6px; }
  .head .ttl { min-width: 0; flex: 1 1 420px; }
  .wb h1 { font-size: 22px; line-height: 1.3; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
  .links-line { display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .linked { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .linked .lk-h { font-weight: 600; }
  .linked ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 6px; }
  .linked li { overflow-wrap: anywhere; }
  .linked .small { color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
  .actions form.act { margin: 0; }
  form.reinv { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  details.more, details.actd { position: relative; }
  details.more > summary, details.actd > summary { list-style: none; }
  details.more > summary::-webkit-details-marker, details.actd > summary::-webkit-details-marker { display: none; }
  .menu, details.actd:not(.inmenu) > form { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; width: min(340px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0, 0, 0, .14); padding: 8px; display: grid; gap: 4px; }
  .menu form.act, .menu details.actd { display: grid; gap: 2px; padding: 6px; border-radius: 8px; }
  .menu form.act:hover, .menu details.actd:hover { background: var(--sunk); }
  .menu .btn { justify-self: start; }
  details.actd.inmenu > form { position: static; box-shadow: none; border: 0; padding: 6px 0 2px; width: auto; }
  .actf { display: grid; gap: 8px; }
  .actf label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
  .actf input, .actf select { width: 100%; }
  .actf button { justify-self: start; }

  .status { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 10px 0; border-block: 1px solid var(--line); font-size: 13.5px; }

  .wb section h2 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-weight: 650; }
  .wb section h2 .sub { font-weight: 400; color: var(--muted); font-size: 12.5px; }
  .chip.okc { color: var(--ok); border-color: currentColor; }
  .chip.warnc { color: var(--warn); border-color: currentColor; }
  .chip.h { color: var(--human); border-color: currentColor; }
  .chip.errc { color: var(--err); border-color: currentColor; }
  /* workbench P5: feedback card and its in-page form */
  .fbcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 8px; max-width: 75ch; }
  .fbcard p { margin: 0 0 6px; } .fbcard p:last-child { margin: 0; }
  .fbline { display: flex; flex-wrap: wrap; gap: 6px; }
  .fbcard .fbt { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
  details.fbd > summary { list-style: none; display: inline-flex; }
  details.fbd > summary::-webkit-details-marker { display: none; }
  .fberr { color: var(--err); font-weight: 600; margin: 0 0 8px; }
  .fbf { display: grid; gap: 10px; margin-top: 10px; max-width: 75ch; }
  .fbf fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .fbf legend { font-size: 12.5px; color: var(--muted); padding: 0; margin-bottom: 4px; width: 100%; }
  .fbf label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
  .fbf label.opt { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); font-size: 13px; }
  .fbf textarea { width: 100%; resize: vertical; }
  .fbf button { justify-self: start; }
  .menu .act.inmenu { display: grid; gap: 2px; padding: 6px; border-radius: 8px; }
  .concl { font-size: 18px; font-weight: 600; line-height: 1.45; margin: 0 0 6px; text-wrap: pretty; max-width: 75ch; }
  .concl .rest { display: block; margin-top: 6px; font-size: 14px; font-weight: 400; color: var(--ink); line-height: 1.55; }
  .note-run { display: flex; gap: 8px; align-items: center; color: var(--accent); font-size: 13px; margin: 0 0 6px; }

  .rows { border-top: 1px solid var(--line); }
  .rows > .crow { border-bottom: 1px solid var(--line); }
  details.crow > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 4px; align-items: baseline; }
  details.crow > summary::-webkit-details-marker { display: none; }
  details.crow > summary:hover { background: var(--sunk); }
  .crow.plain { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px 4px; }
  .crow .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .crow .ref { grid-column: 2; font-size: 12px; color: var(--muted); display: block; overflow-wrap: anywhere; }
  .crow .chev { color: var(--muted); transition: transform .15s; }
  details[open] > summary .chev { transform: rotate(90deg); }
  .q2 { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }

  .detail { margin: 0 4px 12px 40px; background: var(--sunk); border-radius: 10px; min-width: 0; }
  .detail-note { margin: 0 4px 12px 40px; }
  .detail dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; padding: 10px 14px; font-size: 12.5px; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .detail dd.bad { color: var(--err); }
  .detail pre.q { margin: 0; white-space: pre-wrap; word-break: break-word; background: none; padding: 0; }
  .raw { padding: 4px 14px 12px; display: grid; gap: 8px; min-width: 0; }
  .raw .lbl { font-size: 12.5px; font-weight: 600; }
  .raw .lbl .muted { font-weight: 400; }
  .tblwrap { overflow-x: auto; max-width: 100%; }
  table.res { border-collapse: collapse; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 100%; }
  table.res th, table.res td { text-align: left; padding: 3px 12px 3px 0; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
  table.res td.wrapcell { white-space: normal; min-width: 16ch; }
  table.res th { color: var(--muted); font-weight: 500; }
  pre.raw-pre { margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.5; background: none; padding: 0; overflow-x: auto; white-space: pre; max-height: 420px; }
  pre.raw-pre.wrap { white-space: pre-wrap; word-break: break-word; }
  .links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; }
  .evidence-chart { margin: 0; overflow-x: auto; }
  .evidence-chart svg { display: block; min-width: 420px; height: auto; }
  .evidence-chart svg text { fill: var(--muted); font-family: var(--sans); }
  .evidence-chart svg line { stroke: var(--muted); }
  .evidence-chart figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
  .chart-legend { list-style: none; padding: 0; margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; }
  #alert-intake h3 { font-size: 13px; margin: 12px 0 4px; }
  #alert-intake pre { white-space: pre-wrap; word-break: break-word; background: none; padding: 0; margin: 0; }
  #alert-intake table { font-size: 12px; }
  #alert-intake .tw { overflow-x: auto; }

  /* investigation log: rows on rules, not boxes */
  .logtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; font-size: 12.5px; }
  .logtools .sp { flex: 1; }
  .wb .logtools button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 9px; font-size: 12px; font-weight: 500; }
  .wb .logtools button[aria-pressed="true"] { border-color: var(--ink); font-weight: 650; }
  .log { border-top: 1px solid var(--line); }
  .log > * { border-bottom: 1px solid var(--line); }
  .ev { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; padding: 10px 4px; font-size: 13px; align-items: baseline; }
  .ev .evb { display: grid; gap: 4px; min-width: 0; }
  .t { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .step > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 4px; align-items: baseline; }
  .step > summary::-webkit-details-marker { display: none; }
  .step > summary:hover { background: var(--sunk); }
  .step .sumtools { grid-column: 2; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .nowrap { white-space: nowrap; }
  .st-ok { color: var(--ok); } .st-err { color: var(--err); }
  .calls { padding: 0 4px 10px 76px; display: grid; gap: 0; min-width: 0; }
  .call { border-top: 1px solid var(--line-soft); min-width: 0; }
  .call > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; padding: 7px 0; align-items: baseline; font-size: 12.5px; }
  .call > summary::-webkit-details-marker { display: none; }
  .call > summary:hover { background: var(--sunk); }
  .call .q { font-family: var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .call .detail { margin: 0 0 10px; }
  .bubble { background: var(--human-soft); border-radius: 10px; padding: 7px 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .reply { background: var(--accent-soft); border-radius: 10px; padding: 7px 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .ev.live { color: var(--accent); }
  /* C1 (#565): the Agent's task list, drawn apart from the queries */
  .plan-line { border-top: 1px solid var(--line-soft); padding: 7px 0; font-size: 12.5px; }
  .plan-line > summary { cursor: pointer; }
  .plan-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; font-size: 12.5px; }
  .plan-list li { display: flex; gap: 6px; align-items: baseline; overflow-wrap: anywhere; }
  .plan-mark { color: var(--muted); white-space: pre; }
  .plan-completed .plan-mark { color: var(--ok); }
  .plan-failed .plan-mark { color: var(--err); }
  .plan-in_progress .plan-mark { color: var(--accent); }
  /* live view regions (P3-14): wrappers only, so the column's spacing holds */
  #identity, #results, #queue-wrap, #composer-wrap { display: contents; }
  .wb .newchip { position: sticky; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); justify-self: center; margin: 8px auto 0; display: block; border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 999px; padding: 3px 14px; font-size: 12.5px; font-weight: 600; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); z-index: 2; }
  .ev .retry { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .human-row[data-state="not_answered"] .msg-status { color: var(--warn); font-weight: 600; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .queue { margin-top: 10px; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: grid; gap: 4px; }
  .wb .queue .lbl { font-weight: 600; font-size: 13px; margin: 0; }
  .queue ol { margin: 0; padding-left: 1.2em; }
  .composer { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 8px 10px; display: grid; gap: 6px; }
  .wb .composer textarea { border: 0; resize: vertical; outline: none; background: transparent; min-height: 44px; width: 100%; padding: 2px 0; }
  .wb .composer textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wb .composer textarea[disabled] { cursor: not-allowed; }
  .composer .bar { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }

  /* recovery watch */
  .rec-h { margin: 0 0 8px; }
  .samples { display: flex; gap: 2px; height: 22px; max-width: 560px; }
  .samples i { flex: 1 1 0; min-width: 3px; border-radius: 2px; }
  .s-ok { background: var(--ok); }
  .s-bad { background: var(--err); }
  .s-nd { background: repeating-linear-gradient(135deg, var(--muted) 0 1.5px, transparent 1.5px 4px); }
  .s-todo { background: var(--line-soft); }
  .skey { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .skey i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  #progress { margin: 0; padding-left: 0; list-style: none; font-family: var(--mono); font-size: 12px; }
  #progress li { white-space: nowrap; padding: 1px 0; }

  /* chat panel shell */
  .panel { position: sticky; top: 0; height: 100vh; border-left: 1px solid var(--line); background: var(--surface); display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; }
  .ph { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); gap: 8px; }
  .ph b { font-size: 14px; }
  .wb .ph .x { border: 0; background: none; font-size: 20px; color: var(--muted); padding: 0 6px; line-height: 1; }
  .ctx { padding: 8px 16px 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .msgs { overflow: auto; padding: 12px 16px; }
  .pf { padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line-soft); }
  .pf .composer { margin-top: 0; }
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .3); z-index: 19; }
  /* chat panel (P7) */
  .ph .phr { display: inline-flex; align-items: center; gap: 4px; }
  .ctabs { display: inline-flex; gap: 2px; margin-right: auto; margin-left: 8px; }
  .wb .ctabs button { border: 0; background: none; padding: 3px 9px; border-radius: 6px; font-size: 12.5px; color: var(--muted); }
  .wb .ctabs button[aria-selected="true"] { background: var(--sunk); color: var(--ink); }
  .wb .ph .chatnew { padding: 2px 9px; font-size: 12px; }
  .cturn { display: grid; gap: 8px; margin-bottom: 14px; }
  .cturn .who { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .cq { justify-self: end; max-width: 92%; background: var(--human-soft); border-radius: 12px 12px 4px 12px; padding: 7px 10px; }
  .ca { max-width: 96%; border: 1px solid var(--line-soft); border-radius: 12px 12px 12px 4px; padding: 7px 10px; background: var(--surface); }
  .ctext { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cwait { margin: 0; color: var(--muted); }
  .cfail { margin: 0 0 4px; color: var(--err); }
  .crefs { margin: 6px 0 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .cfwd { margin: 6px 0 0; font-size: 12.5px; font-weight: 600; }
  .cfwd.yes { color: var(--human); } .cfwd.no { color: var(--warn); } .cfwd.wait { color: var(--muted); }
  .chist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .wb .chist-item { display: grid; gap: 2px; width: 100%; text-align: left; font-weight: 500; padding: 7px 10px; }
  .chist-title { overflow-wrap: anywhere; }
  #log .flash { outline: 2px solid var(--human); outline-offset: 2px; border-radius: 6px; }
  body.wb .top #openChat { display: inline-block; }

  @media (max-width: 960px) {
    .shell, .shell.chat-closed { grid-template-columns: minmax(0, 1fr); }
    .shell .panel, .shell.chat-closed .panel { display: grid; position: fixed; inset: auto 0 0 0; top: auto; height: 80vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, .2); z-index: 20; transform: translateY(105%); transition: transform .25s; visibility: hidden; }
    .shell .panel.open { transform: none; visibility: visible; }
    .main { padding-inline: 16px; }
    .two { grid-template-columns: minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { .shell .panel { transition: none; } }
  @media (max-width: 560px) {
    .wb h1 { font-size: 19px; }
    .concl { font-size: 16px; }
    .step > summary { grid-template-columns: minmax(0, 1fr) auto; }
    .step > summary .t { grid-column: 1 / 3; }
    .step .sumtools { grid-column: 1 / 3; }
    .calls { padding-left: 4px; }
    .ev { grid-template-columns: minmax(0, 1fr); gap: 2px; }
    .detail, .detail-note { margin-left: 4px; margin-right: 0; }
    .detail dl { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .detail dd { margin-bottom: 6px; }
    details.crow > summary { grid-template-columns: 26px minmax(0, 1fr) auto; }
    .call > summary { grid-template-columns: minmax(0, 1fr) auto; }
    .call .q { grid-column: 1 / 3; order: 3; }
    .menu { right: auto; left: 0; }
  }
</style>

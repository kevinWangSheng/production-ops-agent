<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}OpsPilot{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; max-width: 1100px; }
    h1, h2, h3 { margin: 0.6em 0 0.3em; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #ddd; vertical-align: top; }
    code, pre { font-family: ui-monospace, monospace; font-size: 12px; }
    pre { white-space: pre-wrap; word-break: break-all; background: #f6f6f6; padding: 8px; }
    .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; background: #eee; }
    .facts { border-left: 4px solid #2a7; padding-left: 8px; }
    .hypotheses { border-left: 4px solid #27c; padding-left: 8px; }
    .counter { border-left: 4px solid #c52; padding-left: 8px; }
    .rejected { border-left: 4px solid #999; padding-left: 8px; }
    .unknown { border-left: 4px solid #e9b400; padding-left: 8px; }
    .recommend { border-left: 4px solid #75c; padding-left: 8px; }
    form.inline { display: inline-block; margin: 4px 8px 4px 0; }
    #progress li { margin: 2px 0; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <header>
    <a href="/">Incidents</a>
    <span class="muted">· signed in as <code>{{ principal.actor_id }}</code> ({{ principal.channel }})</span>
  </header>
  {% block body %}{% endblock %}
</body>
</html>

name: release

# Publishes the product image (#394) when a v<version> tag is pushed:
# ghcr.io/kevinwangsheng/opspilot:<version>, linux/amd64 + linux/arm64, with
# min provenance. Nothing else triggers it, and it is the only workflow that
# may write packages. The tag must equal the pyproject version and point at a
# commit on main, and the development checks must pass, before anything is
# built. Installs pin the image by the digest written to the job summary.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout v4
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag equals the pyproject version
        id: version
        run: |
          python3 -I scripts/release/check_version.py --tag "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi
      # astral-sh/setup-uv v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.10.8"
          python-version: "3.12.13"
          enable-cache: false
      - name: Install locked development dependencies
        run: make setup
      - name: Run development checks
        run: make check
      # docker/setup-qemu-action v4.4.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      # docker/setup-buildx-action v4.4.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      # docker/login-action v4.6.0
      - name: Log in to GHCR with the repository token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker/build-push-action v7.4.0
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=min
          tags: ghcr.io/kevinwangsheng/opspilot:${{ steps.version.outputs.version }}
          build-args: |
            OPSPILOT_VERSION=${{ steps.version.outputs.version }}
            OPSPILOT_REVISION=${{ github.sha }}
      - name: Record the pushed digest
        env:
          IMAGE: ghcr.io/kevinwangsheng/opspilot
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### OpsPilot $VERSION"
            echo
            echo "- image: \`$IMAGE:$VERSION\`"
            echo "- pin: \`$IMAGE@$DIGEST\`"
            echo "- revision: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

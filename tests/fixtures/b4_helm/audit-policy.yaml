# CI k8s-backends (B4, #563): record every request on Secrets at Metadata
# level (user, verb, requestURI, response code) and nothing else. Never
# Request or RequestResponse: the audit log must not hold Secret content.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
rules:
  - level: Metadata
    resources:
      - group: ""
        resources: [secrets]
  - level: None
